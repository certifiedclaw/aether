# Aether on an always-on box (iansserver). Reach it over Tailscale / Traefik+Authelia.
#   docker compose up -d --build
#   docker compose exec ollama ollama pull qwen3:4b
# Ollama is optional if you already run one: drop that service and set OLLAMA_URL.
services:
  aether:
    build: .
    image: aether:server
    restart: unless-stopped
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      AETHER_MODEL: ${AETHER_MODEL:-qwen3:4b}
      AETHER_REMOTE_OLLAMA: ${AETHER_REMOTE_OLLAMA:-}   # optional fast GPU host
      AETHER_REMOTE_MODEL: ${AETHER_REMOTE_MODEL:-}
    volumes:
      - aether_config:/app/config     # api keys, TLS cert, trusted plugin hashes
      - aether_data:/app/data
      - aether_memory:/app/memory
      - aether_logs:/app/logs
    ports:
      # bind to the Tailscale IP (or 127.0.0.1 behind Traefik) - never 0.0.0.0 on the LAN
      - "${AETHER_BIND:-127.0.0.1}:8000:8000"
    depends_on: [ollama]
    mem_limit: 2g
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  supervisor:
    # Watchdog (#99): probes Ollama/dashboard/disk/RAM, ntfy only when it cannot fix it.
    # Alert-only by default. To let it restart things, set supervisor_*_restart_cmd in
    # config/api_keys.json (needs a way to reach them, e.g. a docker socket proxy).
    image: aether:server
    restart: unless-stopped
    command: ["python", "-m", "core.supervisor"]
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    network_mode: "service:aether"
    volumes:
      - aether_config:/app/config
      - aether_logs:/app/logs
    depends_on: [aether]
    mem_limit: 128m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m        # keep the model resident; HDD loads are slow
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  aether_config:
  aether_data:
  aether_memory:
  aether_logs:
  ollama_models:
